<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}X-Burst | Competitive Beyblade X Tournament Platform{%
      endblock %}
    </title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS (Note: We will change this to url_for later) -->
    <link rel="stylesheet" href="static/style/main.css" />
  </head>
  <body>
    <!-- Top Navigation Bar -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm"
    >
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <i class="bi bi-tornado me-1 text-warning"></i>X-<span>BURST</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
          aria-controls="navbarContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Explore Tournaments</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="create-event.html">Host Event</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="booking-history.html"
                >My Registrations</a
              >
            </li>
          </ul>
          <div class="d-flex align-items-center gap-2">
            <span class="text-light small d-none d-md-inline me-2"
              ><i class="bi bi-person-circle me-1"></i> Ben M.</span
            >
            <a
              href="create-event.html"
              class="btn btn-warning btn-sm fw-semibold"
              ><i class="bi bi-plus-circle me-1"></i>Create Event</a
            >
          </div>
        </div>
      </div>
    </nav>

    <!-- Dynamic Content Injection -->
    {% block content %} {% endblock %}

    <!-- Global Footer -->
    <footer class="bg-dark text-light py-4 mt-auto border-top border-secondary">
      <div class="container text-center small text-secondary">
        <p class="mb-1">
          <strong>X-Burst</strong> - Competitive Tabletop Event Management
          Platform
        </p>
        <p class="mb-0">
          &copy; 2026 X-Burst Community. All rights reserved. Built with
          Bootstrap 5.
        </p>
      </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
