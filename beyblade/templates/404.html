{% extends 'base.html' %} {% block title %}Page Not Found | X-Burst{% endblock
%} {% block content %}
<main class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card border-0 shadow-sm p-5">
        <i class="bi bi-exclamation-triangle text-warning display-1 mb-3"></i>
        <h1 class="fw-bold display-4">404</h1>
        <h3 class="fw-semibold mb-3">Stadium Not Found</h3>
        <p class="text-muted mb-4">
          It looks like this page was knocked out of the ring. The tournament or
          profile you are looking for doesn't exist or has been moved.
        </p>
        <a
          href="{{ url_for('main.index') }}"
          class="btn btn-primary px-4 py-2 fw-semibold"
        >
          Return to Dashboard
        </a>
      </div>
    </div>
  </div>
</main>
{% endblock %}
