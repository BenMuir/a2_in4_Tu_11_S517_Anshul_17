{% extends 'base.html' %} {% block title %}Server Error | X-Burst{% endblock %}
{% block content %}
<main class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card border-0 shadow-sm p-5">
        <i class="bi bi-hdd-network text-danger display-1 mb-3"></i>
        <h1 class="fw-bold display-4">500</h1>
        <h3 class="fw-semibold mb-3">Internal Server Error</h3>
        <p class="text-muted mb-4">
          Our servers just took a critical hit. We are working to get the arena
          back online. Please try again in a few minutes.
        </p>
        <a
          href="{{ url_for('main.index') }}"
          class="btn btn-outline-danger px-4 py-2 fw-semibold"
        >
          Return to Dashboard
        </a>
      </div>
    </div>
  </div>
</main>
{% endblock %}
